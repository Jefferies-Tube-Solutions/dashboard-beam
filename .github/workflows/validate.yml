name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    name: JTS documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Jefferies-Tube-Solutions/jts-brand-checks@bd6183b373a8add9e7e9161a645fcf74321e1b8d
  documentation-legacy:
    # Classic branch protection still requires this name. Mirror the shared result.
    name: Validate JTS design and documentation
    needs: documentation
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      JTS_CHECK_RESULT: ${{ needs.documentation.result }}
    steps:
      - run: test "$JTS_CHECK_RESULT" = success
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    # The official Marketplace action only supports public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests
